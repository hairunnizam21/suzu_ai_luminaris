[project]
name = "suzu_luminaris_server"
version = "0.1.0"
description = "SuzuAI Luminaris backend — Devin-style coding agent over HTTP, paired with the Luminaris Panel + Client APKs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.8.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.9",
    "paramiko>=3.4.0",
    "anyio>=4.4.0",
    "sse-starlette>=2.1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["suzu_luminaris*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]
ignore = ["B008"]
